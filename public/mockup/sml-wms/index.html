<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SML Warehouse Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: aplikasi gudang dengan sidebar navy (warna korporat) + area kerja terang; aksen kuning keselamatan ala marka lantai gudang.
   GANTI WARNA BRAND DI SINI: --brand (warna utama perusahaan) & --accent (warna aksi). */
:root{
  --brand:#0E2C52; --brand-2:#163C6B; --brand-ink:#E8EEF7; --brand-muted:#8FA3BF;
  --accent:#F5B400; --accent-ink:#1A1400;
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#132033; --muted:#5A6779; --line:#DCE2EA;
  --ok:#17804F; --ok-bg:#E3F4EB; --warn:#B86200; --warn-bg:#FFF1DC; --crit:#C2352B; --crit-bg:#FCE7E5;
  --info:#1F5FCC; --info-bg:#E4EDFC; --rent:#5B3FC4; --rent-bg:#ECE8FB; --teal:#0C7C80; --teal-bg:#DFF3F3; --grey:#6B7280; --grey-bg:#ECEEF1;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(16,32,60,.06),0 4px 14px rgba(16,32,60,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#0A1E38; --brand-2:#12305A; --brand-ink:#E8EEF7; --brand-muted:#8193AE;
  --accent:#FFC21A; --accent-ink:#1A1400;
  --bg:#0E1622; --surface:#152132; --surface-2:#1A283B; --ink:#E6ECF4; --muted:#9AA8BB; --line:#26364C;
  --ok:#4CC88A; --ok-bg:#12352A; --warn:#F2A23A; --warn-bg:#3A2A12; --crit:#F2786E; --crit-bg:#3E1C1A;
  --info:#77A6F5; --info-bg:#162C4E; --rent:#A693F5; --rent-bg:#2A2350; --teal:#4FC6C9; --teal-bg:#123638; --grey:#A0A8B4; --grey-bg:#262F3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#0A1E38; --brand-2:#12305A; --brand-ink:#E8EEF7; --brand-muted:#8193AE;
  --accent:#FFC21A; --accent-ink:#1A1400;
  --bg:#0E1622; --surface:#152132; --surface-2:#1A283B; --ink:#E6ECF4; --muted:#9AA8BB; --line:#26364C;
  --ok:#4CC88A; --ok-bg:#12352A; --warn:#F2A23A; --warn-bg:#3A2A12; --crit:#F2786E; --crit-bg:#3E1C1A;
  --info:#77A6F5; --info-bg:#162C4E; --rent:#A693F5; --rent-bg:#2A2350; --teal:#4FC6C9; --teal-bg:#123638; --grey:#A0A8B4; --grey-bg:#262F3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px}
h3{font-size:17px}
.eyebrow{font:600 11.5px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-left:env(safe-area-inset-left,0px)}
.brandbox{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:38px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px/1 var(--f-display);letter-spacing:.02em}
.logo-txt b{display:block;font:700 19px/1 var(--f-display);letter-spacing:.04em}
.logo-txt span{font-size:11.5px;color:var(--brand-muted);letter-spacing:.06em;text-transform:uppercase}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav .grp{font:600 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--brand-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--brand-ink);text-decoration:none;font-weight:500;font-size:14.5px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--brand-2);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font:700 11px/1 var(--f-body);padding:3px 6px;border-radius:99px}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--brand-muted)}

.main{min-width:0;display:flex;flex-direction:column}
.stripe{height:5px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--brand) 12px 24px)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .search{flex:1;min-width:180px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.top .search input{border:0;background:transparent;outline:0;width:100%}
.top .sp{flex:1}
.sel{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.user{display:flex;align-items:center;gap:8px;font-size:13.5px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-2);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.ribbon{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding-block:6px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.content{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1400px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:70ch}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(.96)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-crit{background:var(--crit-bg);color:var(--crit)}
.c-info{background:var(--info-bg);color:var(--info)} .c-rent{background:var(--rent-bg);color:var(--rent)} .c-teal{background:var(--teal-bg);color:var(--teal)} .c-grey{background:var(--grey-bg);color:var(--grey)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11.5px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.mono{white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.fchip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.fchip .n{opacity:.7;margin-left:4px}
.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}

/* KPI */
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font:700 32px/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi .d b.up{color:var(--ok)} .kpi .d b.dn{color:var(--crit)}
.kpi.alert{border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.spark{width:100%;height:34px}

/* Stacked bar */
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.stack span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend b{font-variant-numeric:tabular-nums;margin-left:4px}

.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;border-radius:99px}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted)}

/* Yard */
.yard{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.unit{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;text-align:left}
.unit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st)}
.unit:hover{box-shadow:var(--shadow)}
.unit .no{font:700 16px/1 var(--f-display);letter-spacing:.03em}
.unit .m{font-size:12.5px;color:var(--muted)}
.unit .row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.pw{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(8,16,30,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;box-shadow:-10px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-b{overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.kv div span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv div b{font-weight:600}
.x{border:0;background:var(--surface-2);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;flex:none}
.qrbox{display:flex;gap:14px;align-items:center;border:1px dashed var(--line);border-radius:9px;padding:12px}
.qr{width:96px;height:96px;background:#fff;padding:6px;border-radius:6px;flex:none;display:grid;place-items:center}
.qr img,.qr canvas{width:84px!important;height:84px!important}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.tl::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:14px;height:14px;border-radius:50%;border:3px solid var(--surface);background:var(--st,var(--muted));box-shadow:0 0 0 1px var(--line);margin-top:3px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--brand-ink);padding:11px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:60;font-weight:500;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}
.toast b{color:var(--accent)}

/* Mobile mock */
.phone-wrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.phone{width:340px;max-width:100%;border-radius:38px;background:#0B1422;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);flex:none}
.screen{border-radius:28px;overflow:hidden;background:var(--bg);height:640px;display:flex;flex-direction:column}
.p-top{background:var(--brand);color:var(--brand-ink);padding:14px 16px 12px}
.p-top .st{display:flex;justify-content:space-between;font-size:11.5px;opacity:.8;margin-bottom:10px}
.p-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.p-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:92px}
.p-tile b{font:700 17px/1.1 var(--f-display)}
.p-tile span{font-size:12px;color:var(--muted)}
.p-scan{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:16px;font:700 20px/1 var(--f-display);letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.viewfinder{aspect-ratio:1;max-width:100%;border-radius:14px;background:repeating-linear-gradient(0deg,#16222f 0 2px,#1b2a3a 2px 4px);position:relative;display:grid;place-items:center;color:#cfe0f5;font-size:13px}
.viewfinder::before{content:"";position:absolute;inset:18%;border:3px solid var(--accent);border-radius:10px}
.viewfinder .laser{position:absolute;left:18%;right:18%;height:2px;background:#ff4b3a;top:50%;box-shadow:0 0 10px #ff4b3a;animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{from{top:22%}to{top:78%}}
@media (prefers-reduced-motion:reduce){.viewfinder .laser{animation:none}}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.stepper output{flex:1;text-align:center;font:700 30px/1 var(--f-display)}
.notes{display:flex;flex-direction:column;gap:12px;max-width:520px;min-width:0;flex:1}
.notes ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-21,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding-right:env(safe-area-inset-right,0px)}
  .brandbox{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
  .nav{flex-direction:row;overflow-x:auto;padding:6px 10px 10px}
  .nav .grp,.side-foot{display:none}
  .nav a{white-space:nowrap}
  .nav a.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .top{position:static}
  .g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .g4{grid-template-columns:minmax(0,1fr)}
  .top,.content,.ribbon{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .user span{display:none}
  .kv{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brandbox">
      <div class="logo">
        <div class="logo-mark">SML</div>
        <div class="logo-txt"><b>SML WAREHOUSE</b><span>Part · Unit · Baterai</span></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Mockup konsep v0.1 · data dummy<br>Login: Rina A. · Admin Gudang Pusat</div>
  </aside>

  <div class="main">
    <div class="stripe" aria-hidden="true"></div>
    <header class="top">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gsearch" placeholder="Cari SKU, nama part, no. unit, WO…" aria-label="Cari">
      </div>
      <span class="sp"></span>
      <select class="sel" id="branch" aria-label="Cabang"></select>
      <div class="user"><div class="avatar">RA</div><span>Rina A.</span></div>
    </header>
    <div class="ribbon">Mockup konsep untuk diskusi internal. Semua data adalah contoh (dummy), dan warna & logo hanya placeholder sampai ada panduan brand resmi.</div>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="overlay"></div>
<div id="toastHost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
/* ============ Data dummy ============ */
const TODAY = new Date("2026-10-29T09:00:00+07:00");
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = a => a[Math.floor(rnd() * a.length)];
const fmtRp = n => "Rp " + Math.round(n).toLocaleString("id-ID");
const fmtJt = n => n >= 1e9 ? "Rp " + (n / 1e9).toLocaleString("id-ID", {maximumFractionDigits: 2}) + " M" : "Rp " + (n / 1e6).toLocaleString("id-ID", {maximumFractionDigits: 1}) + " jt";
const fmtN = n => n.toLocaleString("id-ID");
const dshort = d => d.toLocaleDateString("id-ID", {day: "2-digit", month: "short"});
const dtime = d => d.toLocaleDateString("id-ID", {day: "2-digit", month: "short"}) + " " + d.toLocaleTimeString("id-ID", {hour: "2-digit", minute: "2-digit"});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

const BRANCHES = [
  {code: "CKR", name: "Cikarang (Pusat)"}, {code: "KRW", name: "Karawang"}, {code: "BKS", name: "Bekasi"},
  {code: "TGR", name: "Tangerang"}, {code: "SMG", name: "Semarang"}, {code: "SBY", name: "Surabaya"}, {code: "MDN", name: "Medan"}
];

function issueLine(i) {
  const w = WOS.find(x => x.no === state.woSel) || WOS[0];
  const l = w.lines[i];
  let need = l.qty - l.done;
  const bins = STOCK.filter(s => s.sku === l.sku && s.branch === state.branch && s.qty > 0 && !s.bin.startsWith("VAN")).sort((a, b) => (a.exp || 9e15) - (b.exp || 9e15));
  for (const b of bins) { if (!need) break; const t = Math.min(need, b.qty); b.qty -= t; need -= t; mv(new Date(), l.sku, "ISSUE", b.bin, w.no, t, w.no, "Rina A.", state.branch); }
  l.done = l.qty;
  if (w.lines.every(x => x.done >= x.qty)) w.status = "Part diserahkan";
  renderNav(); R.wo();
  toast(`${l.qty} ${itemBy(l.sku).uom} <b>${l.sku}</b> diserahkan ke ${w.mech} untuk ${w.no}.`);
}

    <div class="kv"><div><span>Hour meter</span><b class="num" style="font-size:20px">${fmtN(u.hm)} jam</b></div><div><span>PM berikutnya</span><b class="num">${fmtN(u.nextPM)} jam (sisa ${u.nextPM - u.hm})</b></div>
      <div><span>Interval PM</span><b>${u.interval} jam</b></div><div><span>Biaya part bulan ini</span><b class="num">${costs ? fmtRp(costs) : "Rp 0"}</b></div>
      ${bat ? `<div><span>Baterai terpasang</span><b>${bat.sn} · ${bat.chem}</b></div><div><span>Kesehatan baterai</span><b class="num">${bat.soh}% SoH · ${fmtN(bat.cycles)} siklus</b></div>` : ""}</div>
    <div><div class="eyebrow" style="margin-bottom:6px">Progres menuju PM</div><div class="bar"><span style="width:${pmPct}%;background:${pmPct > 85 ? "var(--crit)" : pmPct > 65 ? "var(--warn)" : "var(--ok)"}"></span></div></div>
    <div class="qrbox"><div class="qr" id="qrUnit"></div><div><b>Stiker QR unit</b><div class="muted" style="font-size:13px">Mekanik memindai stiker ini untuk membuka WO, inspeksi, dan mencatat hour meter.</div></div></div>
    ${NEXT[u.status].length ? `<div><h3 style="margin-bottom:8px">Ubah status</h3><div class="filters">${NEXT[u.status].map(s => `<button class="btn ${s === "onrent" || s === "ready" ? "pri" : ""}" data-setst="${s}" data-u="${u.no}">→ ${ST[s].l}</button>`).join("")}</div>
      <p class="muted" style="font-size:13px;margin:8px 0 0">${u.status === "onrent" ? "Unit kembali dari pelanggan wajib melalui inspeksi (checklist + foto) sebelum bisa disewakan lagi." : "Perubahan status tercatat di riwayat beserta waktu dan petugas."}</p></div>` : ""}
    <div><h3 style="margin-bottom:10px">Riwayat</h3><div class="timeline">${u.hist.slice().reverse().map(h => `<div class="tl" style="--st:var(${ST[h.s].v})"><i></i><div><b>${ST[h.s].l}</b> <span class="muted">· ${dtime(h.ts)}</span><div class="muted" style="font-size:13px">${esc(h.note)}</div></div></div>`).join("")}</div></div>`);
  qr($("#qrUnit"), "SML|UNIT|" + u.no);
}

    <div class="card kpi"><span class="eyebrow">Di charging bay</span><div class="v">${BATS.filter(b => b.unit === "-").length}</div><div class="d">Siap tukar untuk unit lead-acid</div></div>

    <td class="mono">${b.unit}</td><td>${esc(b.loc)}</td></tr>`).join("")}
  </tbody></table></div></div>`;

/* ---- Mobile app mock ---- */
const P = {screen: "home", item: null, qty: 1, unit: null};
R.mobile = () => {
  $("#view").innerHTML = `
  <div class="pagehead"><div><div class="eyebrow">Aplikasi lapangan · Android / APK</div><h1>Aplikasi Scan untuk Staf Gudang & Mekanik</h1><p>Tombol besar, sedikit ketikan, dan bisa dipakai sambil memakai sarung tangan. Coba alurnya di simulasi HP berikut.</p></div></div>
  <div class="phone-wrap"><div class="phone"><div class="screen" id="phone"></div></div>
    <div class="notes card card-b"><h3>Alur yang bisa dicoba</h3><ol>
      <li><b>Scan part</b>: tekan SCAN, lalu sistem mengenali label part dan menampilkan stok serta lokasi rak.</li>
      <li><b>Picking untuk WO</b>: pilih “Ambil untuk WO”, atur qty, lalu konfirmasi. Stok di dashboard ikut berkurang.</li>
      <li><b>Scan unit</b>: membuka kartu forklift beserta hour meter dan tombol inspeksi.</li>
      <li><b>Opname</b>: hitung fisik per bin langsung dari HP.</li></ol>
      <p class="muted" style="margin:0;font-size:13.5px">Di versi nyata, kamera HP membaca QR. Aplikasi tetap bisa mencatat saat offline (lokasi pelanggan dan tambang) lalu sinkron otomatis saat ada sinyal.</p></div></div>`;
  renderPhone();
};
function renderPhone() {
  const el = $("#phone"); if (!el) return;
  const head = (t, back) => `<div class="p-top"><div class="st"><span>09:41</span><span>4G · 82%</span></div><div style="display:flex;align-items:center;gap:10px">${back ? `<button data-p="home" style="background:rgba(255,255,255,.1);border:0;color:inherit;border-radius:8px;width:34px;height:34px;cursor:pointer" aria-label="Kembali">‹</button>` : `<div class="logo-mark" style="width:32px;height:32px;font-size:14px">SML</div>`}<div><b style="font:700 18px/1 var(--f-display)">${t}</b><div style="font-size:11.5px;opacity:.75">${branchName(state.branch)} · Rina A.</div></div></div></div>`;
  let body = "";
  if (P.screen === "home") {
    const pend = WOS.filter(w => w.status === "Menunggu part").length;
    body = head("SML Gudang") + `<div class="p-body"><button class="p-scan" data-p="scan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>SCAN</button>
      <div class="p-tiles"><button class="p-tile" data-p="scan"><b>Terima barang</b><span>${POS.filter(p => p.status === "Tiba di dock").length} PO di dock</span></button>
      <button class="p-tile" data-p="scan"><b>Picking WO</b><span>${pend} permintaan</span></button>
      <button class="p-tile" data-p="scanunit"><b>Inspeksi unit</b><span>${UNITS.filter(u => u.status === "inspect" && u.branch === state.branch).length} menunggu</span></button>
      <button class="p-tile" data-p="scan"><b>Opname</b><span>Zona A · ${COUNT.length} item</span></button></div>
      <div class="p-card"><div class="eyebrow">Tugas berikutnya</div><div style="margin-top:6px;font-weight:600">${WOS[0].no} · ${WOS[0].unit}</div><div class="muted" style="font-size:13px">${WOS[0].lines.length} part · mekanik ${WOS[0].mech}</div></div></div>`;
  } else if (P.screen === "scan" || P.screen === "scanunit") {
    body = head(P.screen === "scan" ? "Scan label part" : "Scan stiker unit", true) + `<div class="p-body"><div class="viewfinder"><div class="laser"></div><span style="position:absolute;bottom:10px">Arahkan kamera ke QR</span></div>
      <button class="btn pri" data-p="${P.screen === "scan" ? "found" : "unitfound"}" style="justify-content:center;padding:12px">Simulasikan scan berhasil</button>
      <button class="btn" style="justify-content:center">Ketik kode manual</button></div>`;
  } else if (P.screen === "found") {
    const it = P.item = itemBy(WOS[1].lines[0].sku);
    const bins = STOCK.filter(s => s.sku === it.sku && s.branch === state.branch && !s.bin.startsWith("VAN"));
    body = head("Part ditemukan", true) + `<div class="p-body"><div class="p-card"><div class="mono" style="font-size:12px">${it.sku}</div><div style="font:700 19px/1.15 var(--f-display);margin:4px 0">${esc(it.name)}</div>
      <div style="display:flex;justify-content:space-between;margin-top:8px"><span class="muted">Stok cabang</span><b class="num">${qtyAt(it.sku, state.branch)} ${it.uom}</b></div>
      <div style="display:flex;justify-content:space-between"><span class="muted">Rak</span><b class="mono">${bins.map(b => b.bin).join(", ")}</b></div></div>
      <div class="p-card"><div class="eyebrow">Ambil untuk</div><select class="inp" id="pWo" style="margin-top:6px">${WOS.filter(w => w.lines.some(l => l.sku === it.sku)).map(w => `<option>${w.no} · ${w.unit}</option>`).join("") || "<option>Tanpa WO (perlu alasan)</option>"}</select>
      <div class="stepper" style="margin-top:10px"><button data-p="minus" aria-label="Kurangi">−</button><output id="pQty">${P.qty}</output><button data-p="plus" aria-label="Tambah">+</button></div></div>
      <button class="p-scan" data-p="confirm" style="font-size:18px">Konfirmasi ambil</button></div>`;
  } else if (P.screen === "done") {
    body = head("Tersimpan", true) + `<div class="p-body" style="align-items:center;justify-content:center;text-align:center"><div style="width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:36px">✓</div>
      <b style="font:700 22px/1.1 var(--f-display)">${P.qty} ${P.item.uom} diambil</b><span class="muted">${P.item.sku} tercatat keluar ke WO. Dashboard sudah ter-update.</span><button class="btn pri" data-p="home" style="margin-top:8px">Kembali ke beranda</button></div>`;
  } else if (P.screen === "unitfound") {
    const u = P.unit = UNITS.find(x => x.status === "inspect" && x.branch === state.branch) || UNITS[0];
    body = head(u.no, true) + `<div class="p-body"><div class="p-card"><div style="font:700 19px/1.15 var(--f-display)">${u.brand} ${u.model}</div><div class="muted" style="font-size:13px">${String(u.cap).replace(".", ",")} ton · ${chip(ST[u.status].l, ST[u.status].c)}</div>
      <label class="f" style="margin-top:10px">Hour meter saat ini<input class="inp num" value="${u.hm}" inputmode="numeric"></label></div>
      <div class="p-card"><div class="eyebrow" style="margin-bottom:6px">Checklist inspeksi retur</div>${["Garpu & rantai mast", "Kebocoran hidrolik", "Ban", "Rem & parkir", "Lampu, alarm mundur, blue spot", "Body / benturan"].map((c, i) => `<label style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px"><input type="checkbox" ${i < 4 ? "checked" : ""}> ${c}</label>`).join("")}
      <button class="btn" style="margin-top:10px;width:100%;justify-content:center">+ Foto kerusakan</button></div>
      <div class="p-tiles"><button class="btn" data-p="home" style="justify-content:center;padding:12px">Perlu repair</button><button class="btn pri" data-p="home" style="justify-content:center;padding:12px">Lulus → Ready</button></div></div>`;
  }
  el.innerHTML = body;
}

/* ============ Events ============ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-close],[data-item],[data-cat],[data-gr],[data-qc],[data-wo],[data-issue],[data-act],[data-yf],[data-unit],[data-setst],[data-recv],[data-ship],[data-p]");
  if (!t) return;
  const d = t.dataset;
  if ("close" in d) return closeDrawer();
  if (d.p) {
    if (d.p === "plus") { P.qty++; $("#pQty").textContent = P.qty; return; }
    if (d.p === "minus") { P.qty = Math.max(1, P.qty - 1); $("#pQty").textContent = P.qty; return; }
    if (d.p === "confirm") {
      const it = P.item; let need = P.qty; const wo = ($("#pWo").value || "").split(" · ")[0];
      for (const b of STOCK.filter(s => s.sku === it.sku && s.branch === state.branch && s.qty > 0 && !s.bin.startsWith("VAN"))) { if (!need) break; const x = Math.min(need, b.qty); b.qty -= x; need -= x; mv(new Date(), it.sku, "ISSUE", b.bin, wo || "TANPA-WO", x, wo || "TANPA-WO", "Rina A. (HP)", state.branch); }
      const w = WOS.find(w => w.no === wo); if (w) { const l = w.lines.find(l => l.sku === it.sku); if (l) l.done = Math.min(l.qty, l.done + P.qty); if (w.lines.every(l => l.done >= l.qty)) w.status = "Part diserahkan"; }
      P.screen = "done"; renderNav(); return renderPhone();
    }
    if (d.p === "home") P.qty = 1;
    P.screen = d.p; return renderPhone();
  }
  if (d.item) return itemDrawer(d.item);
  if (d.cat) { state.stockCat = d.cat; return R.stok(); }
  if (d.gr) return grDrawer(d.gr);
  if (d.qc) return doPutaway(d.qc);
  if (d.wo) { state.woSel = d.wo; return R.wo(); }
  if (d.issue) return issueLine(+d.issue);
  if (d.yf) { state.yardFilter = d.yf; return R.yard(); }
  if (d.unit) return unitDrawer(d.unit);
  if (d.setst) {
    const u = UNITS.find(x => x.no === d.u); const from = u.status; u.status = d.setst;
    if (d.setst === "onrent" && !u.customer) u.customer = CUSTOMERS[0];
    if (["ready", "inspect", "repair", "standby"].includes(d.setst) && from === "onrent") u.customer = null;
    u.hist.push({ts: new Date(), s: d.setst, note: `${ST[from].l} → ${ST[d.setst].l} oleh Rina A.`});
    unitDrawer(u.no); if (state.view === "yard") { const keep = $("#overlay").innerHTML; R.yard(); $("#overlay").innerHTML = keep; qr($("#qrUnit"), "SML|UNIT|" + u.no); }
    return toast(`<b>${u.no}</b> sekarang ${ST[d.setst].l}.`);
  }
  if (d.recv) { const tr = TRFS.find(x => x.no === d.recv); tr.status = "Diterima"; R.transfer(); return toast(`<b>${tr.no}</b> diterima di ${branchName(tr.to)}. Stok IN-TRANSIT dipindahkan ke rak tujuan.`); }
  if (d.ship) { const tr = TRFS.find(x => x.no === d.ship); tr.status = "Dalam perjalanan"; tr.sent = "29 Okt"; tr.eta = "30 Okt"; R.transfer(); return toast(`<b>${tr.no}</b> dikirim. Barang berstatus IN-TRANSIT.`); }
  const a = d.act;
  if (a === "draftpo") return toast(`Draft PO dibuat untuk <b>${ITEMS.filter(it => qtyAt(it.sku, state.branch) < it.min).length} SKU</b> dan dikirim ke Purchasing untuk persetujuan.`);
  if (a === "export") return toast("Di versi nyata, tombol ini mengunduh file Excel stok per rak.");
  if (a === "reqtrf") return toast(`Permintaan transfer <b>${d.sku}</b> dikirim ke gudang pusat Cikarang.`);
  if (a === "return") return toast("Form retur dibuka: scan part sisa, lalu stok kembali ke rak asal.");
  if (a === "newtrf") { TRFS.unshift({no: "TRF-2610-0" + (54 + TRFS.length), from: "CKR", to: "SMG", items: 4, status: "Draft", sent: "-", eta: "-"}); R.transfer(); return toast("Draft transfer Cikarang → Semarang dibuat."); }
  if (a === "fillcount") { COUNT.forEach((c, i) => c.counted = c.sys + (i % 4 === 1 ? -1 : i % 5 === 3 ? 2 : 0)); return R.opname(); }
  if (a === "submitcount") {
    const diffs = COUNT.filter(c => c.counted !== null && c.counted !== c.sys);
    return toast(diffs.length ? `<b>${diffs.length} penyesuaian</b> diajukan ke Kepala Gudang. Stok berubah setelah disetujui.` : "Tidak ada selisih. Opname zona A selesai.");
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.cnt !== undefined) {
    const i = +e.target.dataset.cnt; const v = e.target.value;
    COUNT[i].counted = v === "" ? null : Math.max(0, +v);
    const pos = e.target.selectionStart; R.opname(); const el = $("#cnt-" + i); el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {}
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
$("#branch").addEventListener("change", e => { state.branch = e.target.value; render(); });
$("#gsearch").addEventListener("input", e => {
  state.q = e.target.value;
  if (/^SML-/i.test(state.q)) { if (state.view !== "yard") { location.hash = "yard"; return; } R.yard(); }
  else { if (state.view !== "stok") { location.hash = "stok"; return; } R.stok(); }
  const g = $("#gsearch"); g.focus();
});
window.addEventListener("hashchange", route);
route();
</script>
